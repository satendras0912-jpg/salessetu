name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: Run isolated local Supabase receipt contract
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/isolated-local-supabase-contract-harness' || github.head_ref == 'feature/harden-lead-capture-rpc-execute')
        shell: bash
        run: |
          set -euo pipefail
          cd local-staging
          trap 'npx --yes supabase@3.2.0 stop --no-backup >/dev/null 2>&1 || true' EXIT
          npx --yes supabase@3.2.0 start >/dev/null
          set -a
          eval "$(npx --yes supabase@3.2.0 status --output env)"
          set +a
          LOCAL_SUPABASE_URL="$API_URL" \
            LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node ./scripts/test-local-receipt.mjs
          node --test ./scripts/test-local-receipt.test.mjs
      - name: Replay all migrations in isolated Supabase
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/isolated-local-supabase-contract-harness' || github.head_ref == 'feature/harden-lead-capture-rpc-execute')
        shell: bash
        run: bash local-staging/scripts/replay-all-migrations-ci.sh
